apiVersion: apps/v1
kind: Deployment
metadata:
  name: securevault-backend
  labels:
    app: securevault
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securevault
      tier: backend
  template:
    metadata:
      labels:
        app: securevault
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: ghcr.io/your-org/securevault/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securevault-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: securevault-secrets
                  key: jwt-refresh-secret
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: securevault-secrets
                  key: mongo-uri
          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: securevault-backend-svc
spec:
  selector:
    app: securevault
    tier: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: securevault-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: securevault
      tier: backend
