worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;   # Don't expose nginx version

  # ── Logging ────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  # ── Performance ─────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip            on;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  # ── Rate Limiting ───────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

  # ── Upstream API ────────────────────────────────────────
  upstream backend {
    server backend:5000;
    keepalive 32;
  }

  upstream frontend {
    server frontend:80;
  }

  server {
    listen 80;
    server_name _;

    # ── Security Headers ──────────────────────────────────
    add_header X-Frame-Options            "DENY"                   always;
    add_header X-Content-Type-Options     "nosniff"                always;
    add_header X-XSS-Protection           "1; mode=block"          always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none';"
      always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

    # ── Auth routes: strict limiting ──────────────────────
    location /api/auth/ {
      limit_req        zone=auth burst=5 nodelay;
      limit_req_status 429;
      proxy_pass       http://backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── General API ───────────────────────────────────────
    location /api/ {
      limit_req        zone=api burst=20 nodelay;
      limit_req_status 429;
      proxy_pass       http://backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 110M;
    }

    # ── Frontend SPA ──────────────────────────────────────
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      # SPA: handle client-side routing
      proxy_intercept_errors on;
      error_page 404 = /index.html;
    }
  }
}
