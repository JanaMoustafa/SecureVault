name: SecureVault CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Phase 1: Static Analysis & Security (Shift-Left)
  # ─────────────────────────────────────────────────────────
  sast:
    name: 🔍 SAST — Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for SonarQube blame data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint — Backend
        run: npm run lint
        working-directory: ./backend

      - name: Lint — Frontend
        run: npm run lint
        working-directory: ./frontend

      - name: Run npm audit (backend)
        run: npm audit --audit-level=high
        working-directory: ./backend

      - name: Run npm audit (frontend)
        run: npm audit --audit-level=high
        working-directory: ./frontend

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=securevault
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

  # ─────────────────────────────────────────────────────────
  # Phase 2: Unit Tests
  # ─────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [sast]
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: --health-cmd mongosh --eval "db.adminCommand('ping')" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & Test Backend
        working-directory: ./backend
        env:
          NODE_ENV:         test
          MONGO_URI:        mongodb://localhost:27017/securevault_test
          JWT_SECRET:       ci-test-secret-32-chars-minimum-ok
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-ok
        run: |
          npm ci
          npm test -- --coverage --forceExit

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage

  # ─────────────────────────────────────────────────────────
  # Phase 3: Build Docker Images
  # ─────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          push:       true
          tags:       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          push:       true
          tags:       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # Phase 4: DAST — Container Vulnerability Scanning (Trivy)
  # ─────────────────────────────────────────────────────────
  dast:
    name: 🛡️ DAST — Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trivy scan — backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          format:    sarif
          output:    trivy-backend.sarif
          severity:  CRITICAL,HIGH
          exit-code: 1

      - name: Trivy scan — frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          format:    sarif
          output:    trivy-frontend.sarif
          severity:  CRITICAL,HIGH
          exit-code: 1

      - name: Upload SARIF reports to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif

  # ─────────────────────────────────────────────────────────
  # Phase 5: Deploy (Production)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [dast]
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/securevault
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
